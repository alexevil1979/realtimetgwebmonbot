# Порты: не занимаем 80/443 (их использует Hiddify и др.).
# По умолчанию только localhost:9080 — доступ через поддомен в панели Hiddify.
services:
  web:
    build: .
    ports:
      - "${UPTIME_BIND:-0.0.0.0}:${UPTIME_PORT:-9080}:8000"
    environment:
      SCHEDULER_ENABLED: "false"
    env_file:
      - .env
    volumes:
      - uptime_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      SCHEDULER_ENABLED: "true"
    env_file:
      - .env
    volumes:
      - uptime_data:/app/data
    restart: unless-stopped
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  uptime_data:
